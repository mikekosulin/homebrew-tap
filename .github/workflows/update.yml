# Keeps Formula/kanareika.rb at the latest kanareika release: every six hours, and on demand (Actions → Run
# workflow). Uses this repository's own token only; nothing is stored anywhere.
name: Update the formula

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo mikekosulin/kanareika --json tagName --jq .tagName)"
          gh release download "$tag" --repo mikekosulin/kanareika --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          bin/formula.sh "$tag" "$RUNNER_TEMP/SHA256SUMS" > Formula/kanareika.rb
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kanareika.rb
          git diff --cached --quiet && { echo "already at $TAG"; exit 0; }
          git commit -qm "kanareika $TAG"
          git push -q

  # the formula installs and its test passes, on both platforms
  check:
    needs: update
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: |
          brew tap mikekosulin/tap
          brew install mikekosulin/tap/kanareika
          brew test mikekosulin/tap/kanareika
